name: Build dependencies

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Source commit to build (defaults to the triggering ref)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows-star
          - os: macos-15
            triplet: arm64-osx-star
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.source_ref }}
      - name: Build and test Release and Debug packages
        run: cmake -DTRIPLET=${{ matrix.triplet }} -P scripts/build.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: star-binaries-${{ matrix.triplet }}-packages
          if-no-files-found: error
          path: |
            out/${{ matrix.triplet }}/*.zip
            out/${{ matrix.triplet }}/*.sha256
