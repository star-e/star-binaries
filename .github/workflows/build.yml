name: Build dependencies

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows-star
          - os: macos-15
            triplet: arm64-osx-star
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and test Release and Debug packages
        run: cmake -DTRIPLET=${{ matrix.triplet }} -P scripts/build.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: star-binaries-${{ matrix.triplet }}-packages
          if-no-files-found: error
          path: |
            out/${{ matrix.triplet }}/*.zip
            out/${{ matrix.triplet }}/*.sha256

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag such as v0.1.0" >&2
            exit 1
          fi
          version=$(node -p 'require("./vcpkg.json")["version-string"]')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag must match vcpkg.json version-string ($version)" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: star-binaries-*-packages
          merge-multiple: true
          path: release-assets
      - name: Validate release assets
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          for triplet in x64-windows-star arm64-osx-star; do
            for suffix in sdk release-runtime debug-runtime; do
              package="star-binaries-$triplet-$suffix.zip"
              test -s "$package"
              test -s "$package.sha256"
            done
          done
          for archive in *.zip; do
            test -s "$archive.sha256"
          done
          sha256sum --check --strict -- *.sha256
      - name: Create and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 \
            --verify-tag --draft --title "Star Binaries $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false