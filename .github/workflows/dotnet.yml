name: Build .NET

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild CoreCLR even if a matching full SDK is cached
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/release-checks.yml

  build:
    needs: checks
    name: CoreCLR ${{ matrix.target.triplet }} Release
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 180
    concurrency:
      group: coreclr-${{ github.ref }}-${{ matrix.target.triplet }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: windows-2022
            triplet: x64-windows-star
            jobs: 4
          - os: macos-15
            triplet: arm64-osx-star
            jobs: 2
    env:
      BUILD_TRIPLET: ${{ matrix.target.triplet }}
      BUILD_JOBS: ${{ matrix.target.jobs }}
    steps:
      - uses: actions/checkout@v6
      - name: Check SDK reuse decisions
        shell: pwsh
        run: ./tests/dotnet/ci-sdk.test.ps1
      - name: Identify full SDK build inputs
        id: config
        shell: pwsh
        env:
          FULL_SDK_HASH: ${{ hashFiles('dotnet-version.cmake', 'scripts/build-dotnet.cmake', 'scripts/dotnet/build-windows.ps1', 'scripts/dotnet/build-macos.sh', 'scripts/dotnet/common.cmake', 'scripts/dotnet/platform.cmake', 'scripts/dotnet/StarDotNetConfig.cmake.in') }}
        run: |
          if (!$env:FULL_SDK_HASH) { throw 'Full SDK input hash is empty' }
          "cache_prefix=coreclr-full-v1-$env:BUILD_TRIPLET-$env:FULL_SDK_HASH-" >> $env:GITHUB_OUTPUT
      - name: Restore matching full SDK archive
        id: cache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@v5
        with:
          path: out/dotnet/full-sdk/${{ matrix.target.triplet }}
          key: ${{ steps.config.outputs.cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.config.outputs.cache_prefix }}
          enableCrossOsArchive: false
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja
          if [ -z "$MATCHED_CACHE" ]; then
            brew install pkg-config icu4c
          fi
          python3 --version
          xcodebuild -version
        env:
          MATCHED_CACHE: ${{ steps.cache.outputs.cache-matched-key }}
      - name: Prepare and validate full SDK
        id: prepare
        timeout-minutes: ${{ steps.cache.outputs.cache-matched-key != '' && 30 || 180 }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/dotnet | Out-Null
          & ./scripts/dotnet/prepare-ci-sdk.ps1 -Triplet $env:BUILD_TRIPLET -Jobs $env:BUILD_JOBS 2>&1 | Tee-Object out/dotnet/pipeline.log
      - name: Cache newly built and validated full SDK
        if: steps.prepare.outputs.built == 'true'
        uses: actions/cache/save@v5
        with:
          path: out/dotnet/full-sdk/${{ matrix.target.triplet }}
          key: ${{ steps.config.outputs.cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: false
      - name: Upload full SDK
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-${{ matrix.target.triplet }}-Release-sdk
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          path: out/dotnet/full-sdk/${{ matrix.target.triplet }}/*
      - name: Package and validate base SDK
        timeout-minutes: 30
        shell: pwsh
        env:
          FULL_SDK_ROOT: ${{ steps.prepare.outputs.sdk_root }}
        run: |
          & cmake "-DSTAR_SDK_ROOT=$env:FULL_SDK_ROOT" -DPROFILE=base -P scripts/package-dotnet.cmake 2>&1 | Tee-Object out/dotnet/base-package.log
          if ($LASTEXITCODE -ne 0) { throw 'Base SDK packaging or validation failed' }
      - name: Upload base SDK
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-${{ matrix.target.triplet }}-Release-base-sdk
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          path: |
            out/dotnet/${{ matrix.target.triplet }}/Release/*-base-sdk.zip
            out/dotnet/${{ matrix.target.triplet }}/Release/*-base-sdk.tar.gz
            out/dotnet/${{ matrix.target.triplet }}/Release/*-base-sdk.*.sha256
      - name: Upload build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-${{ matrix.target.triplet }}-Release-logs
          if-no-files-found: warn
          overwrite: true
          path: |
            out/dotnet/*.log
            out/dotnet/source/artifacts/log/Release/**/*.log
            out/dotnet/source/artifacts/log/Release/**/*.binlog
            out/dotnet/${{ matrix.target.triplet }}/Release/**/CMakeConfigureLog.yaml
            out/dotnet/${{ matrix.target.triplet }}/Release/**/Testing/Temporary/*.log
            out/dotnet/${{ matrix.target.triplet }}/Release/**/provenance/selection.json
            out/dotnet/ci/**/validated.json
            out/dotnet/ci/**/CMakeConfigureLog.yaml
            out/dotnet/ci/**/Testing/Temporary/*.log

  mobile:
    needs: checks
    name: CoreCLR ${{ matrix.target.triplet }} Release runtime pack
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 240
    concurrency:
      group: coreclr-${{ github.ref }}-${{ matrix.target.triplet }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-24.04
            triplet: arm64-android-star
            jobs: 4
          - os: ubuntu-24.04
            triplet: x64-android-star
            jobs: 4
          - os: macos-15
            triplet: arm64-ios-star
            jobs: 2
          - os: macos-15
            triplet: arm64-ios-simulator-star
            jobs: 2
    env:
      BUILD_TRIPLET: ${{ matrix.target.triplet }}
      BUILD_JOBS: ${{ matrix.target.jobs }}
    steps:
      - uses: actions/checkout@v6
      - name: Check mobile orchestration and package validation
        run: |
          python3 tests/dotnet/mobile.test.py
          bash -n scripts/dotnet/build-mobile.sh
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake cpio curl git libicu-dev \
            libkrb5-dev liblttng-ust-dev libssl-dev lld lldb llvm ninja-build pigz python-is-python3
      - name: Install Java for Android libraries
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
      - name: Set up Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        if: runner.os == 'Linux'
        run: |
          ndk_version=$(sed -n 's/^set(STAR_DOTNET_ANDROID_NDK_VERSION "\(.*\)")/\1/p' dotnet-version.cmake)
          api=$(sed -n 's/^set(STAR_DOTNET_ANDROID_API \([0-9]*\))/\1/p' dotnet-version.cmake)
          test -n "$ndk_version" && test -n "$api"
          sdkmanager "ndk;$ndk_version" "platforms;android-$api" "platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
      - name: Install Apple build dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja pkg-config icu4c
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build and check CoreCLR runtime pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/dotnet
          cmake "-DTRIPLET=$BUILD_TRIPLET" "-DJOBS=$BUILD_JOBS" \
            -P scripts/build-dotnet.cmake 2>&1 | tee out/dotnet/pipeline.log
      - name: Upload mobile runtime pack
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-${{ matrix.target.triplet }}-Release-runtime-pack
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          path: |
            out/dotnet/${{ matrix.target.triplet }}/Release/*-runtime-pack.tar.gz
            out/dotnet/${{ matrix.target.triplet }}/Release/*-runtime-pack.tar.gz.sha256
      - name: Upload mobile build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-${{ matrix.target.triplet }}-Release-logs
          if-no-files-found: warn
          overwrite: true
          path: |
            out/dotnet/*.log
            out/dotnet/source/artifacts/log/Release/**/*.log
            out/dotnet/source/artifacts/log/Release/**/*.binlog
            out/dotnet/${{ matrix.target.triplet }}/Release/**/provenance/build.json

