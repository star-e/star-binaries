name: Check release scripts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit whose release tools are checked
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - run: node --test tests/release/*.test.mjs
      - run: node --test tests/ios/simulator-smoke.test.mjs
