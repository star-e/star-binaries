name: Check release scripts

on:
  push:
    branches: [main]
    paths: ['scripts/release/**', 'tests/release/**', 'scripts/ios-simulator-smoke.cmake', 'tests/ios/simulator-smoke*', 'v8-release.json', '.github/workflows/release*.yml']
  pull_request:
    paths: ['scripts/release/**', 'tests/release/**', 'scripts/ios-simulator-smoke.cmake', 'tests/ios/simulator-smoke*', 'v8-release.json', '.github/workflows/release*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: node --test tests/release/release.test.mjs
      - run: node --test tests/ios/simulator-smoke.test.mjs
