name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to populate or retry (vX.Y.Z)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
          fetch-depth: 0
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag such as v0.1.0" >&2
            exit 1
          fi
          version=$(node -p 'require("./vcpkg.json")["version-string"]')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag must match vcpkg.json version-string ($version)" >&2
            exit 1
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Reusable workflows come from the triggering ref. Manual retries must
          # not mix a newer orchestration with scripts read from an older tag.
          git diff --exit-code "$GITHUB_SHA" HEAD -- .github/workflows/release.yml \
            .github/workflows/release-checks.yml .github/workflows/validate-v8.yml
      - name: Check destination release exists and is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/upload-assets.mjs check-release
      - name: Validate SDK release source configuration
        run: node scripts/release/prepare-sdk.mjs check-config
      - name: Validate V8 release source configuration
        run: node scripts/release/prepare-v8.mjs check-config
      - name: Validate CoreCLR release source configuration
        run: node scripts/release/prepare-dotnet.mjs check-config

  checks:
    needs: validate
    uses: ./.github/workflows/release-checks.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_sha }}

  prepare-sdk:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Collect existing SDK packages
        run: node scripts/release/prepare-sdk.mjs prepare sdk-release-assets
      - name: Verify SDK release set
        run: node scripts/release/prepare-sdk.mjs verify sdk-release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: star-sdk-release-packages
          compression-level: 0
          if-no-files-found: error
          path: sdk-release-assets/*

  prepare-v8:
    needs: [validate, checks]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/validate-v8.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_sha }}
      release_tag: ${{ github.event.release.tag_name || inputs.tag }}

  prepare-dotnet:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Prepare existing CoreCLR packages
        run: node scripts/release/prepare-dotnet.mjs prepare dotnet-release-assets
      - name: Verify CoreCLR release set
        run: node scripts/release/prepare-dotnet.mjs verify dotnet-release-assets
      - name: Record CoreCLR coverage
        run: |
          echo '### CoreCLR (experimental)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows/macOS full and base SDKs passed runtime checks in the source workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Android/iOS runtime packs passed compilation and package checks; runtime execution is not yet validated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source run, revisions, versions and SHA-256 are recorded in dotnet-provenance.json.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: star-dotnet-release-packages
          compression-level: 0
          if-no-files-found: error
          path: dotnet-release-assets/*

  verify-assets:
    needs: [validate, prepare-sdk, prepare-v8, prepare-dotnet]
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@v7
        with:
          name: star-sdk-release-packages
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: star-v8-release-packages
          path: release-assets
      - name: Verify SDK release set
        run: node scripts/release/prepare-sdk.mjs verify release-assets
      - name: Verify V8 release set
        run: node scripts/release/prepare-v8.mjs verify release-assets
      - uses: actions/download-artifact@v7
        with:
          name: star-dotnet-release-packages
          path: release-assets
      - name: Verify CoreCLR release set
        run: node scripts/release/prepare-dotnet.mjs verify release-assets
      - name: Record the exact release sources and verify all assets
        run: node scripts/release/release-set.mjs release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: release-validated-assets
          compression-level: 0
          if-no-files-found: error
          path: release-assets/*

  upload:
    needs: [validate, verify-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@v7
        with:
          name: release-validated-assets
          path: release-assets
      - name: Upload assets to the published release
        run: node scripts/release/upload-assets.mjs release-assets
