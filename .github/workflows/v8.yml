name: Build V8 13.6

on:
  push:
    branches: [main]
    paths: ['.gitattributes', 'v8-version.cmake', 'scripts/build-v8.cmake', 'scripts/v8/**', 'patches/v8/**', 'tests/v8/**', 'tests/ios/**', 'scripts/ios-simulator-smoke.cmake', '.github/workflows/v8.yml']
  pull_request:
    paths: ['.gitattributes', 'v8-version.cmake', 'scripts/build-v8.cmake', 'scripts/v8/**', 'patches/v8/**', 'tests/v8/**', 'tests/ios/**', 'scripts/ios-simulator-smoke.cmake', '.github/workflows/v8.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: V8 ${{ matrix.triplet }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows-star
          - os: macos-15
            triplet: arm64-osx-star
          - os: ubuntu-24.04
            triplet: arm64-android-star
          - os: ubuntu-24.04
            triplet: x64-android-star
          - os: macos-15
            triplet: arm64-ios-star
          - os: macos-15
            triplet: arm64-ios-simulator-star
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TRIPLET: ${{ matrix.triplet }}
      SIMULATOR_UDID: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Linux host build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config libglib2.0-dev
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: runner.os == 'Linux'
        with:
          packages: platform-tools
      - name: Install Android NDK
        if: runner.os == 'Linux'
        run: |
          sdkmanager 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Boot iPhone simulator
        if: matrix.triplet == 'arm64-ios-simulator-star'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = & xcrun simctl list devices available --json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list simulators' }
          $device = (($json -join "`n" | ConvertFrom-Json).devices.PSObject.Properties |
            Where-Object { $_.Name -like 'com.apple.CoreSimulator.SimRuntime.iOS-*' } |
            ForEach-Object { $_.Value } |
            Where-Object { $_.isAvailable -and $_.name -like 'iPhone*' } |
            Select-Object -First 1)
          if (-not $device) { throw 'No available iPhone simulator' }
          "SIMULATOR_UDID=$($device.udid)" >> $env:GITHUB_ENV
          if ($device.state -ne 'Booted') {
            & xcrun simctl boot $device.udid
            if ($LASTEXITCODE -ne 0) { throw 'Could not boot simulator' }
          }
          & xcrun simctl bootstatus $device.udid -b
          if ($LASTEXITCODE -ne 0) { throw 'Simulator did not boot' }
      - name: Build V8 and validate relocated SDK
        if: matrix.triplet != 'x64-android-star'
        shell: pwsh
        run: |
          $arguments = @("-DTRIPLET=$env:BUILD_TRIPLET")
          if ($env:SIMULATOR_UDID) { $arguments += "-DSIMULATOR_UDID=$env:SIMULATOR_UDID" }
          & cmake @arguments -P scripts/build-v8.cmake
          if ($LASTEXITCODE -ne 0) { throw 'V8 build or consumer test failed' }
      - name: Enable KVM
        if: matrix.triplet == 'x64-android-star'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build V8 and execute Android consumer
        if: matrix.triplet == 'x64-android-star'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          script: cmake -DTRIPLET=x64-android-star -DANDROID_SERIAL=emulator-5554 -P scripts/build-v8.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: v8-${{ matrix.triplet }}-sdk
          if-no-files-found: error
          path: |
            out/v8/${{ matrix.triplet }}/*.zip
            out/v8/${{ matrix.triplet }}/*.sha256
      - name: Upload build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-${{ matrix.triplet }}-logs
          if-no-files-found: warn
          path: |
            out/v8/${{ matrix.triplet }}/*.log
            out/v8/source/v8/out/${{ matrix.triplet }}-*/args.gn
            out/v8/source/v8/out/${{ matrix.triplet }}-*/.ninja_log
      - name: Shut down iPhone simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: xcrun simctl shutdown "$SIMULATOR_UDID"
