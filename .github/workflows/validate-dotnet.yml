name: Validate CoreCLR SDK

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of Build CoreCLR SDK in this repository
        required: true
        type: string
      triplet:
        description: Packaged target to validate without rebuilding CoreCLR
        required: true
        default: x64-windows-star
        type: choice
        options:
          - x64-windows-star
          - arm64-osx-star

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ${{ inputs.triplet == 'arm64-osx-star' && 'macos-15' || 'windows-2022' }}
    timeout-minutes: 30
    env:
      BUILD_TRIPLET: ${{ inputs.triplet }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Check source workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'build_run_id must be a positive integer' }
          $json = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source workflow run' }
          $run = $json | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/dotnet.yml' -or $run.event -ne 'workflow_dispatch' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'Select a manual Build CoreCLR SDK run from this repository'
          }
      - uses: actions/download-artifact@v7
        with:
          name: dotnet-${{ inputs.triplet }}-Release-sdk
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: out/dotnet/downloaded
      - name: Install macOS consumer build tool
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Verify archive and run native-managed consumer
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -File out/dotnet/downloaded | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' })
          if ($archives.Count -ne 1) { throw 'Expected exactly one CoreCLR SDK archive' }
          & cmake "-DARCHIVE=$($archives[0].FullName)" "-DTRIPLET=$env:BUILD_TRIPLET" -P scripts/dotnet/validate-archive.cmake 2>&1 | Tee-Object out/dotnet/package-validation.log
          if ($LASTEXITCODE -ne 0) { throw 'CoreCLR SDK validation failed' }
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-${{ inputs.triplet }}-validation
          if-no-files-found: warn
          overwrite: true
          path: |
            out/dotnet/package-validation.log
            out/dotnet/package-validation/**/validated.json
            out/dotnet/package-validation/**/CMakeConfigureLog.yaml
            out/dotnet/package-validation/**/Testing/Temporary/*.log
